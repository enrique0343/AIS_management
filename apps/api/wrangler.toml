name = "ais-management-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "dev"
SESSION_TTL_SECONDS = "28800"

# Bindings — IDs deben configurarse antes del primer deploy:
#   npx wrangler d1 create ais_management
#   npx wrangler kv namespace create SESSIONS
#   npx wrangler r2 bucket create ais-docs
#
# Luego reemplaza los placeholders por los IDs reales.

[[d1_databases]]
binding = "DB"
database_name = "ais_management"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_KV_ID"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "ais-docs"
