name = "ais-management-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ais.worke.net → institución principal (registro A proxied ya existe en Cloudflare DNS)
# Los custom domains de clientes (psc.ais.worke.net, etc.) se agregan vía
# Cloudflare Dashboard → Workers & Pages → ais-management-api → Domains & Routes
[[routes]]
pattern = "ais.worke.net/*"
zone_name = "worke.net"

[vars]
APP_ENV = "production"
SESSION_TTL_SECONDS = "28800"

# El SPA se sirve desde el mismo Worker via Workers Assets.
# El build coloca el SPA en ./public (ver script "predeploy").
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "ais_management"
database_id = "cbc5a57a-cafa-4f26-b8c2-8e535c433e48"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id = "a207f2115d374319bbbefe3378ef2dc1"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "ais-docs"
