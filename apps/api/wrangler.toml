name = "ais-management-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "production"
SESSION_TTL_SECONDS = "28800"

[[d1_databases]]
binding = "DB"
database_name = "ais_management"
database_id = "cbc5a57a-cafa-4f26-b8c2-8e535c433e48"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id = "a207f2115d374319bbbefe3378ef2dc1"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "ais-docs"
